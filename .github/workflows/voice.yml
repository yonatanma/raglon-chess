name: Record narration (הקלטת קריינות)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Voice service
        type: choice
        options: [elevenlabs, azure]
        default: elevenlabs
      voice_id:
        description: "ElevenLabs: voice ID (empty = ELEVENLABS_VOICE_ID variable, or a friendly voice picked automatically)"
        default: ""
      tag:
        description: "ElevenLabs: tone tag, for example [cheerfully] (optional)"
        default: ""
      voice:
        description: "Azure: voice name"
        default: he-IL-AvriNeural
      rate:
        description: "Azure: speed"
        default: "-6%"
      pitch:
        description: "Azure: pitch"
        default: "+5%"
      force:
        description: Record everything again
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency: voice
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record
        run: node scripts/gen-voice.mjs
        env:
          PROVIDER: ${{ inputs.provider }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id || vars.ELEVENLABS_VOICE_ID }}
          TAG: ${{ inputs.tag }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          PITCH: ${{ inputs.pitch }}
          FORCE: ${{ inputs.force }}
      - name: Save recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio sw.js
          git diff --cached --quiet && echo "Nothing new" || (git commit -m "Record narration (${{ inputs.provider }})" && git push)
      - name: Publish the site again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
