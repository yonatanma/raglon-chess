name: Record narration (הקלטת קריינות)
on:
  workflow_dispatch:
    inputs:
      voice:
        description: Azure voice
        default: he-IL-AvriNeural
      rate:
        description: Speed (for example -6%)
        default: "-6%"
      pitch:
        description: Pitch (for example +5%)
        default: "+5%"
      force:
        description: Record everything again
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency: voice
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record
        run: node scripts/gen-voice.mjs
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          PITCH: ${{ inputs.pitch }}
          FORCE: ${{ inputs.force }}
      - name: Save recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio sw.js
          git diff --cached --quiet && echo "Nothing new" || (git commit -m "Record narration (${{ inputs.voice }})" && git push)
      - name: Publish the site again
        if: success()
        run: curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
